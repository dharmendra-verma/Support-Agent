[project]
name = "resolvedesk"
version = "0.1.0"
description = "ResolveDesk — autonomous customer-support resolution agent (CCA-F practice app)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1",  # agentic harness: runs the loop, in-process MCP tools
    "anthropic>=0.40",        # direct Messages API for non-agentic / single-shot calls
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
