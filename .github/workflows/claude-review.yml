name: Claude PR Review

# Independent review instance, separate from any session that generated the code.
# `claude -p` is non-interactive so the job can't hang.
#
# OPT-IN: this only runs when the repo variable ENABLE_CLAUDE_REVIEW == 'true'.
#   Enable:  gh variable set ENABLE_CLAUDE_REVIEW --body true
#   Disable: gh variable set ENABLE_CLAUDE_REVIEW --body false   (or delete it)
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Global on/off flag — skipped entirely unless the variable is set to 'true'.
    if: ${{ vars.ENABLE_CLAUDE_REVIEW == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20  # hard stop; per-file passes run concurrently to stay well under this
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need base..head for the diff

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run review (per-file + integration pass)
        env:
          # Preferred: authenticate via the Max/Pro subscription OAuth token so review
          # runs draw from the subscription quota (zero marginal API cost). Generate it
          # locally with `claude setup-token` and store as the CLAUDE_CODE_OAUTH_TOKEN
          # repo secret. See docs/claude-code-setup.md §6 for the token lifecycle.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Fallback (per-token Console billing): for shared/team CI that shouldn't ride
          # a personal subscription, comment out the line above and uncomment this one.
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Reviewer model — Sonnet by default; override repo-wide by setting the
          # REVIEW_MODEL variable (gh variable set REVIEW_MODEL --body opus).
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL || 'sonnet' }}
        run: |
          python ci/run_review.py \
            "origin/${{ github.base_ref }}" \
            "${{ github.event.pull_request.head.sha }}" \
            findings.json

      - name: Post new findings as PR comments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python ci/post_comments.py \
            findings.json \
            "${{ github.repository }}" \
            "${{ github.event.pull_request.number }}" \
            ci/dismissed_patterns.json
